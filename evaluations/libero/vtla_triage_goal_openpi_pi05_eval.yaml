defaults:
  - env/libero_goal@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "/data_vtlax/results/base_eval"
    project_name: vtla-x
    experiment_name: "triage_goal_pi05_base"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    # triage: 9 = put_the_wine_bottle_on_the_rack, 3 = open_the_top_drawer_and_put_the_bowl_inside
    task_id_filter: [9]
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    # triage base = raw pi05_libero_base (0% zero-shot on contact tasks,
    # max headroom). lerobot format — loader compatibility must be
    # smoke-checked first; fallback = format conversion.
    model_path: "/data_vtla/hf/hub/models--lerobot--pi05_libero_base/snapshots/a217bfd3b14673cf2ce597e69997ab21866438dd"
    openpi_data:
      # openpi-format stats computed from lerobot_libero by
      # toolkits/lerobot/calculate_norm_stats.py (run before eval).
      norm_stats_path: "/data_vtlax/norm_stats/lerobot_libero/norm_stats.json"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 5
    openpi:
      noise_level: 0.3
