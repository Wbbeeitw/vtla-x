defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "/data_vtlax/logs"
    project_name: vtla-x
    experiment_name: "smoke_pi05_libero_200"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 200
  val_check_interval: -1
  save_interval: 100

data:
  # LIBERO LeRobot dataset (read-only mount from /data/VTLA)
  train_data_paths: "/data_vtla/data/lerobot_libero"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 16
  seed: 0

  model:
    # pi05_libero_base snapshot copied to writable storage;
    # assets/<repo_id>/norm_stats.json is generated into this dir by
    # toolkits/lerobot/calculate_norm_stats.py before the smoke run.
    model_path: "/data_vtlax/checkpoints/pi05_libero_base"
    num_action_chunks: 10
    action_dim: 7
    add_value_head: False
    openpi:
      config_name: "pi05_libero"
      num_images_in_input: 2
      train_expert_only: True

    openpi_data:
      # Used as OpenPI's norm-stats asset id.
      repo_id: "lerobot_libero"

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 200
    lr_warmup_steps: 20
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
